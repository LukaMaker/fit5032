name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'NoMash-Library-main/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    # The Vue project lives one folder below the repo root
    defaults:
      run:
        working-directory: NoMash-Library-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: NoMash-Library-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}

      # GitHub Pages has no SPA fallback, so serve index.html for unknown routes
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: NoMash-Library-main/dist

permissions:
  contents: write